name: Sync develop with upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CasanovaRamiro/HomeFix.git
          git fetch upstream develop

      - name: Check for upstream changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/develop HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "develop is already up to date with upstream"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "New commits found in upstream/develop"
          fi

      - name: Merge upstream develop
        if: steps.check.outputs.updated == 'true'
        run: git merge --no-edit upstream/develop

      - name: Push to fork
        if: steps.check.outputs.updated == 'true'
        run: git push origin HEAD:develop
